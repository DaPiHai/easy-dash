<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 首帧预置：主题只支持 light/dark（旧版 "system" 归一为 dark），
       材质为 solid/liquid/glow（非法值归一 solid）；theme.js 随后按后端配置校准 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("easydash.theme");
        var theme = t === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
        var m = localStorage.getItem("easydash.material");
        var material = m === "liquid" || m === "glow" ? m : "solid";
        document.documentElement.setAttribute("data-material", material);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.setAttribute("data-material", "solid");
      }
    })();
  </script>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/topbar.css" />
  <link rel="stylesheet" href="css/panels.css" />
  <link rel="stylesheet" href="css/materials.css" />
  <link rel="stylesheet" href="css/motion.css" />
  <link rel="stylesheet" href="css/cursor-glow.css" />
</head>
<body>
  <!-- 顶栏本体：固定 32px 高，窗口被拉高后下方区域留给面板 -->
  <div class="topbar" id="topbar">
    <button id="activities" class="activities" type="button" title="打开活动概览">活动</button>

    <!-- 中间：日期 + 时钟（点击开关通知中心） -->
    <button id="clock-btn" class="clock-btn" type="button" title="通知中心">
      <span id="date" class="clock-date"></span>
      <span id="clock" class="clock-time"></span>
      <span id="unread-dot" class="unread-dot hidden"></span>
    </button>

    <div class="right">
      <!-- 任务托盘镜像（内容由 js/tray.js 渲染） -->
      <div id="tray" class="tray"></div>
      <!-- 右侧：网络/音量/电池聚合图标 + 展开箭头（点击开关控制中心） -->
      <button id="gear-btn" class="gear-btn" type="button" title="管理面板">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.88 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.88.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" />
        </svg>
      </button>
      <button id="cc-btn" class="cc-btn" type="button" title="控制中心">
        <span id="cc-icons" class="cc-icons"></span>
        <span class="cc-arrow">▾</span>
      </button>
    </div>
  </div>

  <!-- 通知中心面板（内容由 js/notifications.js 渲染） -->
  <div id="panel-notifications" class="panel panel-notifications hidden"></div>

  <!-- 控制中心面板（内容由 js/control-center.js 渲染） -->
  <div id="panel-control" class="panel panel-control hidden"></div>

  <!-- 托盘 hover 提示 -->
  <div id="tooltip" class="tooltip hidden"></div>

  <!-- 滚轮音量 OSD：顶栏内浮层（窗口常态仅 32px 高，必须留在条内） -->
  <div id="vol-osd" class="vol-osd" role="status" aria-live="polite" aria-hidden="true">
    <span class="vol-osd-ico" id="vol-osd-ico"></span>
    <span class="vol-osd-text" id="vol-osd-text"></span>
    <span class="vol-osd-bar"><span class="vol-osd-fill" id="vol-osd-fill"></span></span>
  </div>

  <!-- 液态玻璃折射滤镜：feDisplacementMap 只作用于玻璃底图与边缘折射层，不碰文字。
       注意：不能用 display:none（Chromium 会解析不到 filter 引用），用 0×0 的文档内 SVG。 -->
  <svg
    class="lg-filters"
    width="0"
    height="0"
    aria-hidden="true"
    focusable="false"
    style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none"
  >
    <defs>
      <!-- 玻璃体：低频、较大位移，负责整体液态波动 -->
      <filter
        id="lg-refract"
        x="-15%"
        y="-15%"
        width="130%"
        height="130%"
        color-interpolation-filters="sRGB"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.006 0.012"
          numOctaves="2"
          seed="11"
          result="lgNoise"
        />
        <feGaussianBlur in="lgNoise" stdDeviation="2" result="lgSoftNoise" />
        <feDisplacementMap
          in="SourceGraphic"
          in2="lgSoftNoise"
          scale="12"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
      <!-- 边缘折射：高频、小位移，让镜面高光带一点有机的液态弯曲 -->
      <filter
        id="lg-refract-edge"
        x="-10%"
        y="-10%"
        width="120%"
        height="120%"
        color-interpolation-filters="sRGB"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.02 0.035"
          numOctaves="2"
          seed="4"
          result="lgEdgeNoise"
        />
        <feGaussianBlur in="lgEdgeNoise" stdDeviation="0.7" result="lgEdgeSoft" />
        <feDisplacementMap
          in="SourceGraphic"
          in2="lgEdgeSoft"
          scale="3"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </defs>
  </svg>

  <script>
    // 独立于模块的错误捕获：模块脚本语法/加载失败也能把原因显示出来
    (function () {
      function show(msg) {
        try {
          var b = document.getElementById("boot-err") || document.createElement("div");
          b.id = "boot-err";
          b.style.cssText =
            "position:fixed;bottom:4px;left:50%;transform:translateX(-50%);" +
            "background:rgba(192,28,40,.92);color:#fff;font-size:11px;padding:3px 10px;" +
            "border-radius:8px;max-width:90vw;overflow:hidden;white-space:nowrap;z-index:999";
          b.textContent = "顶栏启动失败: " + msg;
          document.body.appendChild(b);
        } catch (e) {}
      }
      window.addEventListener("error", function (e) {
        show(
          (e.message || "脚本错误") +
            (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "")
        );
      });
      window.addEventListener("unhandledrejection", function (e) {
        show("Promise: " + ((e.reason && (e.reason.message || e.reason)) || "unknown"));
      });
    })();
  </script>
  <script type="module" src="js/topbar.js"></script>
</body>
</html>
