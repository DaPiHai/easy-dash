<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>
    // 首帧预置：主题只支持 light/dark（旧版 "system" 归一为 dark），
    // 材质为 solid/liquid/glow（非法值归一 solid）；theme.js 随后按后端配置校准。
    (function () {
      try {
        var t = localStorage.getItem("easydash.theme");
        var theme = t === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
        var m = localStorage.getItem("easydash.material");
        var material = m === "liquid" || m === "glow" ? m : "solid";
        document.documentElement.setAttribute("data-material", material);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.setAttribute("data-material", "solid");
      }
    })();
  </script>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/launcher.css" />
  <link rel="stylesheet" href="css/materials.css" />
  <link rel="stylesheet" href="css/motion.css" />
  <link rel="stylesheet" href="css/cursor-glow.css" />
</head>
<body>
  <!-- 全屏背景：点击空白（target 为 #backdrop 本身）关闭应用中心 -->
  <div id="backdrop">
    <div id="ac-panel">
      <!-- 搜索行：输入框 + 应用数量 + 导入 + 刷新 -->
      <div class="ac-searchbar">
        <span class="ac-search-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
        </span>
        <input
          id="ac-search"
          type="text"
          placeholder="搜索应用…"
          autocomplete="off"
          spellcheck="false"
          aria-label="搜索应用"
        />
        <span id="ac-count" class="ac-count"></span>
        <button id="ac-import" class="ac-import" type="button" title="导入应用（.exe / .lnk / .url）">
          <span class="ac-import-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg>
          </span>
          <span id="ac-import-label">导入</span>
        </button>
        <button id="ac-refresh" class="ac-refresh" type="button" title="刷新应用列表">
          <span class="ac-refresh-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
          </span>
          <span id="ac-refresh-label">刷新</span>
        </button>
      </div>

      <!-- 分页网格：只渲染当前页，禁止纵向滚动（行数由脚本按视口高度计算） -->
      <div id="ac-scroll" class="ac-scroll">
        <div id="ac-grid" class="ac-grid"></div>
        <div id="ac-status" class="ac-status hidden"></div>
      </div>

      <!-- 分页器：上一页 / 圆点 / 计数 / 下一页；只有一页时隐藏 -->
      <div id="ac-pager" class="ac-pager hidden" role="group" aria-label="分页">
        <button id="ac-pager-prev" class="ac-pager-btn" type="button" title="上一页" aria-label="上一页">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <div id="ac-pager-dots" class="ac-dots"></div>
        <span id="ac-pager-count" class="ac-pager-count">1 / 1</span>
        <button id="ac-pager-next" class="ac-pager-btn" type="button" title="下一页" aria-label="下一页">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>

      <!-- 启动失败提示（3s 后消失） -->
      <div id="ac-error" class="ac-error hidden"></div>

      <!-- 导入/移除结果提示（成功绿色，失败红色；3s 后消失） -->
      <div id="ac-toast" class="ac-toast hidden"></div>

      <!-- 底部快捷键提示 -->
      <div class="ac-hint">Enter 打开 · Esc 关闭 · Alt+Space 切换 · 滚轮换页<span id="ac-drag-hint"> · 拖拽排序</span></div>
    </div>
  </div>

  <!-- 导入应用的右键菜单（fixed 定位在鼠标处） -->
  <div id="ac-menu" class="ac-menu hidden"></div>

  <script>
    // 独立于模块的错误捕获：模块脚本语法/加载失败也能把原因显示出来
    (function () {
      function show(msg) {
        try {
          var b = document.getElementById("boot-err") || document.createElement("div");
          b.id = "boot-err";
          b.style.cssText =
            "position:fixed;bottom:16px;left:50%;transform:translateX(-50%);" +
            "background:rgba(192,28,40,.92);color:#fff;font-size:11px;padding:3px 10px;" +
            "border-radius:8px;max-width:90vw;overflow:hidden;white-space:nowrap;z-index:999";
          b.textContent = "应用中心启动失败: " + msg;
          document.body.appendChild(b);
        } catch (e) {}
      }
      window.addEventListener("error", function (e) {
        show(
          (e.message || "脚本错误") +
            (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "")
        );
      });
      window.addEventListener("unhandledrejection", function (e) {
        show("Promise: " + ((e.reason && (e.reason.message || e.reason)) || "unknown"));
      });
    })();
  </script>
  <script type="module" src="js/launcher.js"></script>
</body>
</html>
