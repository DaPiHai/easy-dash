<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/launcher.css" />
</head>
<body>
  <!-- 全屏背景：点击空白（target 为 #backdrop 本身）关闭应用中心 -->
  <div id="backdrop">
    <div id="ac-panel">
      <!-- 搜索行：输入框 + 应用数量 + 刷新 -->
      <div class="ac-searchbar">
        <span class="ac-search-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
        </span>
        <input
          id="ac-search"
          type="text"
          placeholder="搜索应用…"
          autocomplete="off"
          spellcheck="false"
          aria-label="搜索应用"
        />
        <span id="ac-count" class="ac-count"></span>
        <button id="ac-refresh" class="ac-refresh" type="button" title="刷新应用列表">
          <span class="ac-refresh-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
          </span>
          <span id="ac-refresh-label">刷新</span>
        </button>
      </div>

      <!-- 可纵向滚动的应用网格 -->
      <div id="ac-scroll" class="ac-scroll">
        <div id="ac-grid" class="ac-grid"></div>
        <div id="ac-status" class="ac-status hidden"></div>
      </div>

      <!-- 启动失败提示（3s 后消失） -->
      <div id="ac-error" class="ac-error hidden"></div>

      <!-- 底部快捷键提示 -->
      <div class="ac-hint">Enter 打开 · Esc 关闭 · Alt+Space 切换</div>
    </div>
  </div>

  <script>
    // 独立于模块的错误捕获：模块脚本语法/加载失败也能把原因显示出来
    (function () {
      function show(msg) {
        try {
          var b = document.getElementById("boot-err") || document.createElement("div");
          b.id = "boot-err";
          b.style.cssText =
            "position:fixed;bottom:16px;left:50%;transform:translateX(-50%);" +
            "background:rgba(192,28,40,.92);color:#fff;font-size:11px;padding:3px 10px;" +
            "border-radius:8px;max-width:90vw;overflow:hidden;white-space:nowrap;z-index:999";
          b.textContent = "应用中心启动失败: " + msg;
          document.body.appendChild(b);
        } catch (e) {}
      }
      window.addEventListener("error", function (e) {
        show(
          (e.message || "脚本错误") +
            (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "")
        );
      });
      window.addEventListener("unhandledrejection", function (e) {
        show("Promise: " + ((e.reason && (e.reason.message || e.reason)) || "unknown"));
      });
    })();
  </script>
  <script type="module" src="js/launcher.js"></script>
</body>
</html>
